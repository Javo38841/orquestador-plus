version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Node 22 is the target runtime: its types must not jump ahead of it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Angular decides when a new TypeScript major is supported.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']
      electron:
        patterns: ['electron', 'electron-builder']
      lint-and-test:
        patterns:
          ['eslint', '@eslint/*', 'typescript-eslint', 'vitest', '@playwright/test', 'prettier']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
