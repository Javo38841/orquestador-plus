name: Agent · healthcheck

# Manual check that the Claude token works: asks for a one-word answer and shows
# the full output, so authentication errors are visible.
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/agent-healthcheck.yml']

permissions:
  contents: read

jobs:
  ping:
    name: Ping Claude
    if: github.actor == 'Javo38841' && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Ask Claude for a one-word answer
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          show_full_output: true
          prompt: Reply with exactly the word OK and nothing else.
          claude_args: --max-turns 1
