name: Bug
description: Algo que no funciona como debería.
labels: ['bug', 'por-aprobar']
body:
  - type: textarea
    id: sintoma
    attributes:
      label: Síntoma
      placeholder: Qué pasa y qué esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión y sistema
      placeholder: 0.1.0-dev.3 · Fedora 44
  - type: textarea
    id: criterios
    attributes:
      label: Criterio de aceptación
      value: |
        - **CP-nn-mm** *(unitario)* — Dado …, cuando …, entonces …
